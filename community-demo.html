<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>English Evolution Community</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  /* Layout: mobile-first single column; member area = header + section tabs (bottom bar on phones); admin = same shell with its own tabs.
     Tokens copied from the existing English Evolution site so the community reads as part of it. Single light look, as on the main site. */
  :root{
    --bg:#FBF6EE; --surface:#FFFDF9; --sand:#F2E9DA; --line:#EAE0CE; --ink:#16231F; --muted:#4F5B57; --faint:#7C847F;
    --teal:#3A7F8C; --teal-dark:#2E6874; --teal-soft:#E6F0F1; --coral:#E3997E; --coral-soft:#FBE7DE; --coral-ink:#9A4A30;
    --note-bg:#FFF4D6; --note-border:#E3B53E; --note-ink:#5A4A1A;
    --danger:#B4473A; --danger-soft:#F8E1DD; --ok:#2F7A55; --ok-soft:#E1F1E8;
    --radius:20px; --display:"Outfit",system-ui,sans-serif; --body:"Open Sans",system-ui,sans-serif;
    color-scheme:light;
  }
  *{box-sizing:border-box}
  html,body{background:var(--bg)}
  body{margin:0;color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.55;-webkit-text-size-adjust:100%}
  h1,h2,h3,h4,.btn,.eyebrow,.brand,.tab,.chip{font-family:var(--display)}
  h1,h2,h3{margin:0;text-wrap:balance}
  h1{font-size:clamp(1.9rem,6vw,3rem);line-height:1.08;letter-spacing:-.02em;font-weight:800}
  h2{font-size:clamp(1.4rem,4.2vw,2rem);line-height:1.15;letter-spacing:-.01em;font-weight:800}
  h3{font-size:1.12rem;font-weight:700;line-height:1.3}
  p{margin:0;color:var(--muted)}
  a{color:var(--teal-dark)}
  button{font:inherit}
  .wrap{max-width:1040px;margin:0 auto;padding-inline:16px}
  @media(min-width:700px){.wrap{padding-inline:24px}}
  .stack{display:flex;flex-direction:column;gap:16px}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .muted{color:var(--muted)} .small{font-size:.88rem} .faint{color:var(--faint)}
  .eyebrow{display:flex;align-items:center;gap:12px;color:var(--teal);font-weight:600;font-size:.8rem;letter-spacing:.09em;text-transform:uppercase}
  .eyebrow::before{content:"";width:36px;height:3px;border-radius:3px;background:var(--coral)}
  :focus-visible{outline:3px solid var(--coral);outline-offset:2px}

  /* buttons */
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--teal);color:#fff;text-decoration:none;font-weight:600;font-size:1rem;padding:14px 24px;border-radius:999px;border:0;cursor:pointer;box-shadow:0 10px 22px -12px rgba(58,127,140,.8);transition:background .15s,transform .15s;min-height:48px;text-align:center}
  .btn:hover{background:var(--teal-dark)}
  .btn:active{transform:translateY(1px)}
  .btn.ghost{background:transparent;color:var(--teal-dark);box-shadow:none;border:2px solid var(--teal)}
  .btn.ghost:hover{background:var(--teal-soft)}
  .btn.coral{background:var(--coral);color:var(--ink);box-shadow:0 10px 22px -12px rgba(227,153,126,.9)}
  .btn.coral:hover{background:#DB8A6C}
  .btn.danger{background:var(--danger);box-shadow:none}
  .btn.sm{padding:8px 16px;font-size:.9rem;min-height:38px}
  .btn.block{width:100%}
  .btn[disabled]{opacity:.45;cursor:default}
  .linkbtn{background:none;border:0;padding:6px 2px;color:var(--teal-dark);font-weight:600;cursor:pointer;font-family:var(--display);font-size:.9rem;text-decoration:none}
  .linkbtn:hover{text-decoration:underline}
  .linkbtn.quiet{color:var(--faint);font-weight:600}
  .linkbtn.red{color:var(--danger)}

  /* form */
  label.lab{display:block;font-family:var(--display);font-weight:700;font-size:.95rem;margin-bottom:6px}
  .hint{font-size:.85rem;color:var(--faint);margin-top:6px}
  .input,textarea.input,select.input{width:100%;font:inherit;font-size:16px;color:var(--ink);background:#fff;border:2px solid var(--line);border-radius:14px;padding:12px 14px;transition:border-color .15s}
  .input:focus{outline:none;border-color:var(--teal)}
  textarea.input{min-height:120px;resize:vertical;line-height:1.5}
  .field{display:flex;flex-direction:column}
  .err{color:var(--danger);font-size:.88rem;margin-top:6px}

  /* demo bar + notes (same convention as the other demo pages) */
  .demobar{position:relative;z-index:80;background:var(--ink);color:#F2E9DA;font-size:.82rem;padding:8px 16px;display:flex;justify-content:space-between;align-items:center;gap:8px 14px;flex-wrap:wrap}
  .demobar strong{color:#fff}
  .roles{display:flex;gap:4px;background:rgba(255,255,255,.08);padding:3px;border-radius:999px;flex-wrap:wrap}
  .roles button{background:none;border:0;color:#E9E1D2;padding:5px 12px;border-radius:999px;cursor:pointer;font-family:var(--display);font-weight:600;font-size:.82rem}
  .roles button[aria-pressed="true"]{background:#F2E9DA;color:var(--ink)}
  .demotools{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
  .toggle{background:var(--note-border);color:var(--ink);border:0;border-radius:999px;padding:5px 12px;font-weight:700;font-family:var(--display);cursor:pointer;font-size:.82rem}
  .toggle.dim{background:transparent;color:#E9E1D2;border:1px solid rgba(255,255,255,.3)}
  .note{background:var(--note-bg);border:2px dashed var(--note-border);border-radius:14px;padding:12px 16px;font-size:.88rem;color:var(--note-ink);line-height:1.5}
  .note b.t{display:block;font-family:var(--display);color:#8A6A10;font-size:.72rem;letter-spacing:.09em;text-transform:uppercase;margin-bottom:3px}
  .note p{color:var(--note-ink)}
  .note code{background:rgba(227,181,62,.2);padding:0 4px;border-radius:4px;font-size:.85em}
  body.clean .note{display:none}

  /* site nav */
  .topnav{background:var(--surface);border-bottom:1px solid var(--line)}
  .topnav .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:68px}
  .brand{display:flex;align-items:center;gap:10px;font-weight:400;font-size:.92rem;line-height:1.05;letter-spacing:.12em;color:var(--ink);text-decoration:none;background:none;border:0;cursor:pointer;padding:0;text-align:left}
  .brand .e{width:40px;height:40px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-weight:800;font-size:1.5rem;letter-spacing:0;flex:none}
  .brand .tagc{display:block;font-weight:700;letter-spacing:.08em;font-size:.68rem;color:var(--teal);margin-top:3px;text-transform:uppercase}
  .navright{display:flex;align-items:center;gap:12px}
  .navmore{font-family:var(--display);font-weight:600;font-size:.92rem;color:var(--muted);text-decoration:none;background:none;border:0;cursor:pointer}
  .navmore:hover{color:var(--ink)}
  @media(max-width:520px){.hide-sm{display:none}}
  .navlinks{display:flex;gap:26px;font-family:var(--display);font-weight:600;align-items:center}
  .navlinks a{color:var(--ink);text-decoration:none}
  .navlinks a.cur{color:var(--teal-dark);box-shadow:inset 0 -3px 0 var(--coral)}
  .navlinks .mobonly{display:none}
  .navcta{padding:10px 20px;font-size:.95rem;min-height:0}
  .dd{position:relative}
  .dd>button{background:none;border:0;font:inherit;color:var(--ink);cursor:pointer;padding:0;display:flex;align-items:center;gap:6px}
  .dd>button::after{content:"";width:7px;height:7px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(45deg) translateY(-3px)}
  .dd .ddmenu{position:absolute;top:calc(100% + 14px);left:-18px;min-width:230px;background:var(--surface);border-radius:14px;box-shadow:0 18px 40px -18px rgba(22,35,31,.45);padding:8px;display:none;z-index:60}
  .dd .ddmenu::before{content:"";position:absolute;left:0;right:0;top:-14px;height:14px}
  .dd:hover .ddmenu,.dd.open .ddmenu,.dd:focus-within .ddmenu{display:block}
  .dd .ddmenu a{display:block;padding:10px 14px;border-radius:10px}
  .dd .ddmenu a:hover{background:var(--sand)}
  .dd .ddmenu small{display:block;font-family:var(--body);font-weight:400;color:var(--muted);font-size:.82rem}
  .topnav{position:relative;z-index:40}
  .menubtn{display:none;align-items:center;gap:8px;background:none;border:2px solid var(--ink);color:var(--ink);border-radius:999px;padding:8px 14px;font-family:var(--display);font-weight:700;font-size:.92rem;cursor:pointer}
  .menubtn span{display:block;width:16px;height:2px;background:currentColor;box-shadow:0 5px 0 currentColor,0 -5px 0 currentColor}
  @media(max-width:960px){
    .menubtn{display:inline-flex}
    .navlinks{display:none;position:absolute;top:100%;left:0;right:0;background:var(--surface);flex-direction:column;align-items:stretch;gap:0;padding:8px 20px 18px;box-shadow:0 18px 30px -20px rgba(22,35,31,.45);border-top:1px solid var(--line)}
    .topnav.open .navlinks{display:flex}
    .navlinks>a,.dd>button{padding:12px 0;border-bottom:1px solid var(--line);width:100%;text-align:left}
    .navlinks a.cur{box-shadow:none}
    .navlinks .mobonly{display:block}
    .dd>button{pointer-events:none}
    .dd>button::after{display:none}
    .dd .ddmenu{display:block;position:static;box-shadow:none;background:none;padding:4px 0 8px 12px;min-width:0}
    .dd .ddmenu::before{display:none}
  }
  @media(max-width:420px){.navcta{padding:8px 14px;font-size:.88rem}.brand .e{width:36px;height:36px;font-size:1.35rem}.menubtn{padding:7px 11px}}
  .mebtn{display:flex;align-items:center;gap:8px;background:none;border:2px solid var(--line);border-radius:999px;padding:3px 12px 3px 3px;cursor:pointer;font-family:var(--display);font-weight:600;font-size:.9rem;color:var(--ink)}
  .mebtn:hover{border-color:var(--teal)}

  /* section tabs: top row on desktop, bottom bar on phones */
  .tabs{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:30}
  .tabs .wrap{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
  .tabs .wrap::-webkit-scrollbar{display:none}
  .tab{display:flex;align-items:center;gap:8px;background:none;border:0;border-bottom:3px solid transparent;padding:14px 12px 11px;cursor:pointer;color:var(--muted);font-weight:600;font-size:.95rem;white-space:nowrap}
  .tab svg{width:20px;height:20px;flex:none}
  .tab:hover{color:var(--ink)}
  .tab[aria-current="page"]{color:var(--teal-dark);border-bottom-color:var(--teal)}
  .tab .count{background:var(--coral);color:var(--ink);border-radius:999px;font-size:.72rem;padding:1px 7px;font-weight:800}
  @media(max-width:760px){
    .tabs.member{position:fixed;top:auto;bottom:0;left:0;right:0;border-bottom:0;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);box-shadow:0 -10px 24px -18px rgba(22,35,31,.4)}
    .tabs.member .wrap{padding-inline:4px;gap:0;justify-content:space-around}
    .tabs.member .tab{flex-direction:column;gap:2px;font-size:.7rem;padding:9px 4px 8px;border-bottom:0;border-top:3px solid transparent;flex:1;min-width:0}
    .tabs.member .tab[aria-current="page"]{border-top-color:var(--teal);border-bottom-color:transparent}
    .tabs.member .tab .full{display:none}
    body.has-bottom main{padding-bottom:96px}
  }
  @media(min-width:761px){.tabs.member .tab .short{display:none}}

  main{padding-block:28px 64px}
  @media(min-width:700px){main{padding-block:40px 80px}}

  /* generic blocks */
  .panel{background:var(--surface);border-radius:var(--radius);padding:20px;box-shadow:0 14px 34px -24px rgba(22,35,31,.4)}
  @media(min-width:700px){.panel{padding:26px}}
  .rule{display:flex;gap:12px;align-items:flex-start;background:var(--teal-soft);border-radius:16px;padding:14px 16px;color:var(--teal-dark);font-size:.95rem}
  .rule svg{flex:none;width:22px;height:22px;margin-top:1px}
  .rule p{color:var(--teal-dark)}
  .rule strong{font-family:var(--display)}
  .chip{display:inline-flex;align-items:center;gap:6px;background:var(--sand);color:var(--ink);font-weight:700;font-size:.74rem;letter-spacing:.06em;text-transform:uppercase;padding:4px 10px;border-radius:999px;white-space:nowrap}
  .chip.teal{background:var(--teal);color:#fff}
  .chip.coral{background:var(--coral-soft);color:var(--coral-ink)}
  .chip.ok{background:var(--ok-soft);color:var(--ok)}
  .chip.red{background:var(--danger-soft);color:var(--danger)}
  .back{display:inline-flex;align-items:center;gap:6px;font-family:var(--display);font-weight:600;color:var(--muted);background:none;border:0;cursor:pointer;padding:0;font-size:.95rem}
  .back:hover{color:var(--ink)}
  .pagehead{display:flex;flex-direction:column;gap:10px}
  .pagehead p{font-size:1.05rem}
  hr.sep{border:0;border-top:1px solid var(--line);margin:4px 0}

  /* avatars */
  .av{border-radius:50%;flex:none;display:grid;place-items:center;font-family:var(--display);font-weight:800;color:var(--ink);overflow:hidden;background:var(--sand)}
  .av img{width:100%;height:100%;object-fit:cover}
  .av.anming img{object-position:50% 30%;transform:scale(1.35);transform-origin:48% 32%}
  .who{display:flex;align-items:center;gap:10px;min-width:0}
  .who b{font-family:var(--display);font-size:.98rem;display:block;line-height:1.2}
  .who small{display:block;color:var(--faint);font-size:.82rem}
  .who .badge{display:inline-block;margin-left:6px;background:var(--ink);color:#fff;font-size:.62rem;letter-spacing:.08em;text-transform:uppercase;padding:2px 7px;border-radius:999px;vertical-align:2px;font-family:var(--display)}

  /* ===== public welcome ===== */
  .hero{position:relative;overflow:hidden;padding-block:40px 48px}
  .hero::before{content:"";position:absolute;left:-200px;top:-180px;width:520px;height:520px;border-radius:50%;background:radial-gradient(circle,rgba(58,127,140,.22),transparent 65%)}
  .hero::after{content:"";position:absolute;right:-180px;bottom:-240px;width:520px;height:520px;border-radius:50%;background:radial-gradient(circle,rgba(227,153,126,.26),transparent 65%)}
  .hero .wrap{position:relative;z-index:1;display:grid;gap:28px}
  @media(min-width:880px){.hero .wrap{grid-template-columns:1.2fr .9fr;align-items:center;gap:48px}.hero{padding-block:64px 72px}}
  .hero h1 em{font-style:normal;color:var(--teal)}
  .hero .lede{font-size:1.12rem;max-width:560px}
  .freepill{display:inline-flex;align-items:center;gap:8px;background:var(--ink);color:#fff;font-family:var(--display);font-weight:700;font-size:.85rem;padding:6px 14px;border-radius:999px;align-self:flex-start}
  .freepill i{width:8px;height:8px;border-radius:50%;background:#7FD4B0;display:block}
  .ytbox{background:var(--surface);border-radius:var(--radius);padding:22px;box-shadow:0 24px 48px -30px rgba(22,35,31,.5);display:flex;flex-direction:column;gap:14px;border-top:5px solid var(--coral)}
  .ytbox h3{font-size:1.25rem}
  .lockres{display:flex;flex-direction:column;gap:8px}
  .lockres .lr{display:flex;justify-content:space-between;gap:10px;align-items:center;background:var(--bg);border-radius:12px;padding:10px 12px;font-size:.92rem}
  .lockres .lr b{font-family:var(--display);font-weight:700;min-width:0}
  .lockres .lr span{font-size:.78rem;color:var(--faint);white-space:nowrap}
  section.band{padding-block:48px}
  @media(min-width:700px){section.band{padding-block:72px}}
  section.band.sand{background:var(--sand)}
  .feat{display:grid;gap:14px;margin-top:28px;grid-template-columns:1fr}
  @media(min-width:640px){.feat{grid-template-columns:1fr 1fr}}
  @media(min-width:960px){.feat{grid-template-columns:repeat(3,1fr)}}
  .feat .panel{display:flex;flex-direction:column;gap:8px}
  .ico{width:44px;height:44px;border-radius:14px;background:var(--coral-soft);color:var(--coral-ink);display:grid;place-items:center;flex:none}
  .ico svg{width:24px;height:24px}
  .ico.teal{background:var(--teal-soft);color:var(--teal-dark)}
  .waylist{display:grid;gap:12px;margin-top:24px}
  @media(min-width:760px){.waylist{grid-template-columns:1fr 1fr}}
  .way{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border-radius:16px;padding:16px}
  .way .x{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-family:var(--display);font-size:.9rem}
  .way .x.y{background:var(--ok-soft);color:var(--ok)} .way .x.n{background:var(--danger-soft);color:var(--danger)}
  .way b{font-family:var(--display);display:block}
  .paidrow{display:grid;gap:14px;margin-top:22px}
  @media(min-width:700px){.paidrow{grid-template-columns:1fr 1fr}}
  .paid{display:flex;justify-content:space-between;gap:14px;align-items:center;border:2px solid var(--line);border-radius:16px;padding:16px 18px;background:var(--surface)}
  .paid b{font-family:var(--display);font-size:1.05rem;display:block}
  .paid .price{font-family:var(--display);font-weight:800;color:var(--ink);white-space:nowrap}
  .paid .price small{font-weight:600;color:var(--faint)}

  /* ===== auth ===== */
  .authcard{max-width:480px;margin:0 auto}
  .fine{font-size:.86rem;color:var(--muted);background:var(--bg);border-radius:12px;padding:12px 14px;display:flex;gap:10px}
  .fine svg{flex:none;width:18px;height:18px;margin-top:2px;color:var(--teal)}
  .steps3{display:flex;gap:6px;justify-content:center;margin-bottom:6px}
  .steps3 i{height:5px;width:44px;border-radius:5px;background:var(--line);display:block}
  .steps3 i.on{background:var(--teal)}
  .mail{border:1px solid var(--line);border-radius:18px;background:#fff;overflow:hidden;box-shadow:0 20px 40px -30px rgba(22,35,31,.5)}
  .mail .mh{padding:12px 16px;background:var(--bg);font-size:.82rem;color:var(--muted);border-bottom:1px solid var(--line)}
  .mail .mh b{color:var(--ink)}
  .mail .mb{padding:20px 18px;display:flex;flex-direction:column;gap:12px;font-size:.95rem}
  .mail .mf{padding:12px 18px;font-size:.75rem;color:var(--faint);border-top:1px solid var(--line)}
  .photoedit{display:flex;gap:16px;align-items:center;flex-wrap:wrap}

  /* ===== member home ===== */
  .finder{background:var(--ink);color:#fff;border-radius:26px;padding:26px 20px 22px;position:relative;overflow:hidden}
  .finder::after{content:"";position:absolute;right:-120px;top:-140px;width:360px;height:360px;border-radius:50%;background:radial-gradient(circle,rgba(58,127,140,.55),transparent 65%);pointer-events:none}
  .finder > *{position:relative;z-index:1}
  @media(min-width:700px){.finder{padding:40px 40px 32px}}
  .finder .eyebrow{color:#F1C24B}
  .finder h1{color:#fff;margin-top:10px}
  .finder .sub{color:#D9E4E1;font-size:1.05rem;margin-top:8px;max-width:620px}
  .searchbar{display:flex;flex-direction:column;gap:10px;margin-top:20px}
  @media(min-width:640px){.searchbar{flex-direction:row;background:#fff;border-radius:999px;padding:6px;gap:6px}}
  .searchbar .sfield{position:relative;flex:1;min-width:0}
  .searchbar .sfield svg{position:absolute;left:18px;top:50%;transform:translateY(-50%);width:22px;height:22px;color:var(--teal-dark);pointer-events:none}
  .searchbar input{width:100%;font:inherit;font-size:18px;border:0;border-radius:999px;padding:18px 18px 18px 52px;background:#fff;color:var(--ink);min-height:60px}
  .searchbar input:focus{outline:3px solid var(--coral);outline-offset:2px}
  @media(min-width:640px){.searchbar input:focus{outline:none}.searchbar:focus-within{outline:3px solid var(--coral);outline-offset:3px}}
  .searchbar .btn{min-height:60px;font-size:1.05rem;letter-spacing:.04em;text-transform:uppercase;font-weight:700;padding-inline:28px;background:var(--coral);color:var(--ink);box-shadow:none}
  .searchbar .btn:hover{background:#DB8A6C}
  .tryline{margin-top:12px;font-size:.88rem;color:#BFCFCB;display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center}
  .tryline button{background:rgba(255,255,255,.1);color:#fff;border:0;border-radius:999px;padding:4px 12px;cursor:pointer;font-size:.85rem}
  .tryline button:hover{background:rgba(255,255,255,.2)}
  .results{margin-top:18px;display:flex;flex-direction:column;gap:10px}
  .results .rhead{font-size:.88rem;color:#BFCFCB;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
  .res{background:#fff;color:var(--ink);border-radius:16px;padding:14px 16px;display:grid;grid-template-columns:1fr;gap:10px;align-items:center}
  @media(min-width:640px){.res{grid-template-columns:1fr auto}}
  .res h3{font-size:1.08rem}
  .res .meta{font-size:.82rem;color:var(--faint);margin-top:2px}
  .res .meta i{font-style:normal;color:var(--muted)}
  .res .acts{display:flex;gap:8px;flex-wrap:wrap}
  .res mark{background:#FDE9A8;color:inherit;border-radius:3px;padding:0 1px}

  try { if (location.hash.slice(1) !== route) history.pushState(null, '', '#' + route); } catch (e) {}
  render();
  if (!keepScroll) window.scrollTo(0, 0);
}
function resolve(route) {
  if (!route) route = S.role === 'visitor' ? 'welcome' : (S.role === 'admin' ? 'admin-inbox' : 'home');
  const base = route.split('-')[0];
  // Login gate switched off for review: anyone opening the community lands inside as a member.
  if (S.role === 'visitor' && !PUBLIC.includes(route)) { if (GATE_OFF) S.role = 'member'; else { UI.gated = true; return 'login'; } }
  if (S.role !== 'visitor' && PUBLIC.includes(route) && route !== 'setup') return S.role === 'admin' ? 'admin-inbox' : 'home';
  if (base === 'admin' && !isAdmin()) return 'home';
  return route;
}
function closeMenus() { UI.menu = UI.navOpen = UI.ddOpen = false; }

/* ---------- shell ---------- */
function render() {
  UI.route = resolve(UI.route);
  const r = UI.route, base = r.split('-')[0];
  document.querySelectorAll('.roles button').forEach(b => b.setAttribute('aria-pressed', b.dataset.role === S.role));
  const inMember = S.role !== 'visitor' && base !== 'admin' && r !== 'setup';
  document.body.classList.toggle('has-bottom', inMember);
  let html = '';
  if (isAdmin()) html += adminBar(base === 'admin');
  html += topnav();
  if (inMember) html += memberTabs(r);
  if (base === 'admin') html += adminTabs(r);
  html += '<main>' + view(r) + '</main>';
  html += footer();
  $('#app').innerHTML = html;
  stopPlayback();
  afterRender(r);
}
function view(r) {
  const [base, arg] = [r.split('-')[0], r.split('-').slice(1).join('-')];
  switch (base) {
    case 'welcome': return vWelcome();
    case 'join': return vJoin();
    case 'login': return vLogin();
    case 'verify': return vVerify();
    case 'loginsent': return vLoginSent();
    case 'setup': return vSetup();
    case 'home': return vHome();
    case 'library': return vLibrary();
    case 'lesson': return vLesson(arg);
    case 'week': return vLesson(S.lotw, true);
    case 'assign': return vAssign(arg || S.lotw);
    case 'intros': return vIntros();
    case 'qa': return vQA();
    case 'profile': return vProfile();
    case 'programs': return vPrograms();
    case 'admin': return vAdmin(arg);
    default: return vHome();
  }
}

function libList(q) {

}

/* ---------- audio: recorder + player ---------- */
const REC_MAX = 60;
const R = { state: 'idle', secs: 0, timer: null, media: null, chunks: [], url: null, sim: false, stream: null, level: null };
function recUI() {
  if (R.state === 'idle') return `<div class="rec"><span class="lbl">Tap to start recording. Up to 1 minute.</span>
    <button class="bigrec" data-act="rec-start" aria-label="Start recording"><i></i></button>
    <div class="clock">0:00 <small>/ 1:00</small></div>
    ${R.err ? `<span class="simnote">${esc(R.err)}</span>` : ''}</div>`;
  if (R.state === 'recording') return `<div class="rec"><span class="lbl">Recording… tap to stop</span>
    <button class="bigrec stop" data-act="rec-stop" aria-label="Stop recording"><i></i></button>
    <div class="clock" id="recclock">${mmss(R.secs)} <small>/ 1:00</small></div>
    <div class="meter"><i id="recmeter" style="width:${R.secs / REC_MAX * 100}%"></i></div>
    <div class="bars" id="recbars">${'<i style="height:6px"></i>'.repeat(24)}</div>
    ${R.sim ? '<span class="simnote">Microphone isn\'t available in this preview, so this recording is simulated.</span>' : ''}</div>`;
  return `<div class="rec"><span class="lbl">Listen back before you post.</span>
    ${player('draft', R.secs)}
    <div class="row"><button class="btn ghost sm" data-act="rec-redo">Re-record</button><button class="btn coral" data-act="rec-submit" data-id="${UI.route.split('-')[1] || S.lotw}">Post my audio response</button></div>
    ${R.sim ? '<span class="simnote">Simulated recording (no microphone in this preview).</span>' : ''}</div>`;
}
function refreshRec() { const el = $('#rec'); if (el) el.innerHTML = recUI(); }
async function recStart() {
  R.err = ''; R.secs = 0; R.chunks = []; R.sim = false;
  if (R.url) { URL.revokeObjectURL(R.url); R.url = null; }
  try {
    if (!navigator.mediaDevices || !window.MediaRecorder) throw new Error('unsupported');
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    R.stream = stream;
    const types = ['audio/webm;codecs=opus', 'audio/mp4', 'audio/webm'];
    const mt = types.find(t => MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(t));
    R.media = new MediaRecorder(stream, mt ? { mimeType: mt } : undefined);
    R.media.ondataavailable = e => e.data.size && R.chunks.push(e.data);
    R.media.onstop = () => { R.url = URL.createObjectURL(new Blob(R.chunks, { type: R.media.mimeType || 'audio/webm' })); stream.getTracks().forEach(t => t.stop()); R.state = 'done'; refreshRec(); };
    R.media.start();
    try { const ac = new (window.AudioContext || window.webkitAudioContext)(); const an = ac.createAnalyser(); an.fftSize = 64; ac.createMediaStreamSource(stream).connect(an); R.level = { ac, an, buf: new Uint8Array(an.frequencyBinCount) }; } catch (e) { R.level = null; }
  } catch (e) {
    R.sim = true; R.media = null; R.level = null;
  }
  R.state = 'recording'; refreshRec();
  const t0 = Date.now();
  R.timer = setInterval(() => {
    R.secs = Math.min(REC_MAX, (Date.now() - t0) / 1000);
    const c = $('#recclock'); if (c) c.innerHTML = mmss(R.secs) + ' <small>/ 1:00</small>';
    const m = $('#recmeter'); if (m) m.style.width = (R.secs / REC_MAX * 100) + '%';
    const bars = document.querySelectorAll('#recbars i');
    if (R.level) R.level.an.getByteFrequencyData(R.level.buf);
    bars.forEach((b, i) => { const v = R.level ? R.level.buf[i % R.level.buf.length] / 255 : Math.random() * .8 + .1; b.style.height = Math.max(4, v * 34) + 'px'; });
    if (R.secs >= REC_MAX) { recStop(); toast('One minute is the maximum, so recording stopped.'); }
  }, 120);
}
function recStop() {
  clearInterval(R.timer); R.secs = Math.max(1, Math.round(R.secs));
  if (R.level) { try { R.level.ac.close(); } catch (e) {} R.level = null; }
  if (R.media && R.media.state !== 'inactive') R.media.stop();
  else { R.state = 'done'; refreshRec(); }
}
function recReset() { clearInterval(R.timer); if (R.media && R.media.state !== 'inactive') { try { R.media.onstop = null; R.media.stop(); } catch (e) {} } if (R.stream) R.stream.getTracks().forEach(t => t.stop()); R.state = 'idle'; R.secs = 0; }

function player(id, dur) {
  return `<div class="player" data-pid="${id}"><button class="pbtn" data-act="play" data-id="${id}" aria-label="Play">${I.play}</button><span class="track"><i></i></span><span class="dur">${mmss(dur)}</span></div>`;
}
const P = { id: null, audio: null, raf: null, start: 0, dur: 0, utter: null };
function stopPlayback() {
  if (P.audio) { P.audio.pause(); P.audio = null; }
  if (P.utter && window.speechSynthesis) speechSynthesis.cancel();
  P.utter = null; cancelAnimationFrame(P.raf);
  if (P.id) { const el = document.querySelector(`[data-pid="${P.id}"]`); if (el) { el.querySelector('.pbtn').innerHTML = I.play; el.querySelector('.track i').style.width = '0'; } }
  P.id = null;
}
function play(id) {
  if (P.id === id) { stopPlayback(); return; }
  stopPlayback();
  const el = document.querySelector(`[data-pid="${id}"]`); if (!el) return;
  const r = id === 'draft' ? { url: R.url, dur: R.secs } : S.responses.find(x => x.id === id);
  const url = id === 'draft' ? R.url : blobs[id];
  P.id = id; el.querySelector('.pbtn').innerHTML = I.pause;
  const bar = el.querySelector('.track i'), lab = el.querySelector('.dur');
  const total = r.dur || 30;
  if (url) {
    const a = new Audio(url); P.audio = a; a.play().catch(() => {});
    a.onended = stopPlayback;
    const tick = () => { if (P.audio !== a) return; const d = isFinite(a.duration) ? a.duration : total; bar.style.width = (a.currentTime / d * 100) + '%'; lab.textContent = mmss(a.currentTime); P.raf = requestAnimationFrame(tick); };
    tick(); return;
  }
  // Sample responses: read the example transcript aloud with the browser's voice so the player can be tried.
  if (r.transcript && window.speechSynthesis) {
    const u = new SpeechSynthesisUtterance(r.transcript); u.lang = 'en-US'; u.rate = 1; P.utter = u;
    u.onend = () => { if (P.utter === u) stopPlayback(); };
    speechSynthesis.cancel(); speechSynthesis.speak(u);
  }
  P.start = performance.now(); P.dur = total;
  const tick = () => { if (P.id !== id) return; const t = (performance.now() - P.start) / 1000; bar.style.width = Math.min(100, t / total * 100) + '%'; lab.textContent = mmss(Math.min(t, total)); if (t >= total && !P.utter) { stopPlayback(); return; } P.raf = requestAnimationFrame(tick); };
  tick();
}

function findContent(rep) {
  if (rep.kind === 'reply') { const p = S.intros.find(i => i.id === rep.parentId); const r = p && p.replies.find(x => x.id === rep.targetId); return r && { text: r.text, memberId: r.memberId, where: 'Reply in Introductions' }; }
  if (rep.kind === 'intro') { const p = S.intros.find(i => i.id === rep.targetId); return p && { text: p.text, memberId: p.memberId, where: 'Introduction' }; }
  if (rep.kind === 'response') { const p = S.responses.find(i => i.id === rep.targetId); return p && { text: p.type === 'audio' ? '(audio response) ' + (p.transcript || '') : p.text, memberId: p.memberId, where: 'Assignment response' }; }
  if (rep.kind === 'question') { const p = S.qa.find(i => i.id === rep.targetId); return p && { text: p.q + (p.detail ? '\n' + p.detail : ''), memberId: p.memberId, where: 'Q&A question' }; }
}
function reportItem(rep) {
  const c = findContent(rep);
  if (!c) return '';
  const m = member(c.memberId);
  return `<div class="item" style="border-left:5px solid var(--danger)"><span class="ctx">${c.where} by ${esc(m.display)} · reported by ${esc(member(rep.reporterId).display)} · ${fdate(rep.date)}</span>
    <span class="chip red" style="align-self:flex-start">${esc(rep.reason)}</span>
    <p style="color:var(--ink);white-space:pre-wrap;background:var(--bg);border-radius:12px;padding:10px 12px">${esc(c.text)}</p>
    <div class="row"><button class="btn danger sm" data-act="rep-delete" data-id="${rep.id}">Delete the post</button><button class="btn ghost sm" data-act="rep-suspend" data-id="${rep.id}">Delete and suspend ${esc(m.display)}</button><button class="linkbtn" data-act="rep-keep" data-id="${rep.id}">Keep it, dismiss report</button></div></div>`;
}

/* ---------- content mutations ---------- */
function removeContent(kind, id, parent) {
  if (kind === 'response') S.responses = S.responses.filter(x => x.id !== id);
  if (kind === 'intro') S.intros = S.intros.filter(x => x.id !== id);
  if (kind === 'question') S.qa = S.qa.filter(x => x.id !== id);
  if (kind === 'reply') { const p = S.intros.find(i => i.id === parent); if (p) p.replies = p.replies.filter(x => x.id !== id); }
  S.reports = S.reports.filter(r => r.targetId !== id && !(kind === 'intro' && r.parentId === id));
}
function findEditable(e) {
  if (e.kind === 'response') return S.responses.find(x => x.id === e.id);
  if (e.kind === 'intro') return S.intros.find(x => x.id === e.id);
  if (e.kind === 'question') return S.qa.find(x => x.id === e.id);
  if (e.kind === 'reply') { const p = S.intros.find(i => i.id === e.parent); return p && p.replies.find(x => x.id === e.id); }
}
function clearInline() { UI.editing = UI.replying = UI.reporting = UI.confirming = UI.feedbackFor = UI.answerFor = null; }
function rerender() { const y = window.scrollY; render(); window.scrollTo(0, y); }
function resizeImage(file, max, cb) {
  const fr = new FileReader();
  fr.onload = () => { const img = new Image(); img.onload = () => {
    const s = Math.min(1, max / Math.max(img.width, img.height)); const c = document.createElement('canvas');
    c.width = Math.round(img.width * s); c.height = Math.round(img.height * s); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    cb(c.toDataURL('image/jpeg', .85)); }; img.onerror = () => toast('That file could not be read as an image. Try a JPG or PNG.'); img.src = fr.result; };
  fr.readAsDataURL(file);
}
function setRole(role) {
  recReset(); clearInline(); S.role = role; save();
  go(role === 'visitor' ? 'welcome' : role === 'admin' ? 'admin-inbox' : 'home');
}

/* ---------- actions ---------- */
const ACT = {
  menu: () => { UI.menu = !UI.menu; rerender(); },
  logout: () => setRole('visitor'),
  navtoggle: () => { UI.navOpen = !UI.navOpen; rerender(); },
  dd: () => { UI.ddOpen = !UI.ddOpen; rerender(); },
  nolink: () => toast('That page isn\'t part of these demos yet.'),
  'ext-doc': a => openExternal('doc', (lesson(a.dataset.id) || {}).title || 'the lesson'),
  'ext-yt': () => openExternal('yt'),
  resend: () => toast('Sent again. It can take a minute to arrive.'),
  verify: () => { S.role = 'member'; save(); go('setup'); },
  'login-link': () => { S.role = 'member'; S.firstVisit = false; save(); go('home'); },
  'skip-setup': () => finishSetup(),
  'photo-remove': () => { member(meId()).photo = null; save(); rerender(); },
  'see-all': () => { UI.libSearch = UI.search; UI.libShow = 50; go('library'); },
  'lib-more': () => { UI.libShow += 25; $('#libres').innerHTML = libList(UI.libSearch); },
  back: () => go(UI.prev && UI.prev !== UI.route ? UI.prev : 'library'),
  mode: a => { UI.assign.mode = a.dataset.mode; if (a.dataset.mode === 'text') recReset(); rerender(); },
  'submit-text': a => {
    const t = UI.assign.text.trim();
    if (!t) { toast('Write your answer first, then post it.'); $('#atext').focus(); return; }
    const id = uid('r'); S.responses.push({ id, lessonId: +a.dataset.id, memberId: 'me', prompt: UI.assign.prompt, type: 'text', text: t, date: nowIso(), seen: false });
    UI.assign.text = ''; save(); render(); scrollToPost(id);
    toast('Posted. Other members can read it now. Anming gives feedback on some responses, not every one.');
  },
  'rec-start': () => recStart(),
  'rec-stop': () => recStop(),
  'rec-redo': () => { stopPlayback(); if (R.url) URL.revokeObjectURL(R.url); R.url = null; R.state = 'idle'; R.secs = 0; refreshRec(); },
  'rec-submit': a => {
    stopPlayback();
    const id = uid('r'); if (R.url) blobs[id] = R.url;
    S.responses.push({ id, lessonId: +a.dataset.id, memberId: 'me', prompt: UI.assign.prompt, type: 'audio', dur: R.secs, date: nowIso(), seen: false, transcript: R.sim ? 'This is a simulated recording from the mockup.' : '' });
    R.url = null; R.state = 'idle'; R.secs = 0; save(); render(); scrollToPost(id);
    toast('Your audio response is posted. Other members can listen to it.');
  },
  play: a => play(a.dataset.id),
  edit: a => { clearInline(); UI.editing = { kind: a.dataset.kind, id: a.dataset.id, parent: a.dataset.parent }; rerender(); const t = $('#edittext'); if (t) t.focus(); },
  'edit-save': () => {
    const it = findEditable(UI.editing); const t = $('#edittext').value.trim();
    if (it) { if (UI.editing.kind === 'question') { it.q = $('#editq').value.trim() || it.q; it.detail = t; } else if (t) it.text = t; }
    clearInline(); save(); rerender(); toast('Saved.');
  },
  cancel: () => { clearInline(); rerender(); },
  del: a => { clearInline(); UI.confirming = a.dataset.kind + ':' + a.dataset.id; rerender(); },
  'del-yes': a => { removeContent(a.dataset.kind, a.dataset.id, a.dataset.parent); clearInline(); save(); rerender(); toast('Deleted.'); },
  report: a => { clearInline(); UI.reporting = a.dataset.kind + ':' + a.dataset.id; rerender(); },
  'report-send': a => {
    const reason = (document.querySelector('input[name="rr"]:checked') || {}).value || 'Something else';
    S.reports.push({ id: uid('rep'), kind: a.dataset.kind, targetId: a.dataset.id, parentId: a.dataset.parent || null, reason, reporterId: meId(), date: nowIso() });
    clearInline(); save(); rerender(); toast('Thanks. Anming will review it. The post stays up until she does.');
  },
  'reply-open': a => { clearInline(); UI.replying = a.dataset.id; rerender(); $('#replytext').focus(); },
  'reply-send': a => {
    const t = $('#replytext').value.trim(); if (!t) { toast('Write a reply first.'); return; }
    S.intros.find(i => i.id === a.dataset.id).replies.push({ id: uid('ir'), memberId: meId(), date: nowIso(), text: t });
    clearInline(); save(); rerender();
  },
  'fb-open': a => { clearInline(); UI.feedbackFor = a.dataset.id; rerender(); $('#fbtext').focus(); },
  'fb-send': a => {
    const t = $('#fbtext').value.trim(); if (!t) { toast('Write your feedback first.'); return; }
    const r = S.responses.find(x => x.id === a.dataset.id); r.feedback = { text: t, date: nowIso() }; r.seen = true;
    clearInline(); save(); rerender(); toast('Feedback posted. ' + esc(member(r.memberId).display) + ' gets an email.');
  },
  'ans-open': a => { clearInline(); UI.answerFor = a.dataset.id; rerender(); $('#anstext').focus(); },
  'ans-send': a => {
    const t = $('#anstext').value.trim(); if (!t) { toast('Write your answer first.'); return; }
    const q = S.qa.find(x => x.id === a.dataset.id); q.answer = { text: t, date: nowIso() };
    clearInline(); save(); rerender(); toast('Answer posted. ' + esc(member(q.memberId).display) + ' gets an email.');
  },
  'admin-del-q': a => { removeContent('question', a.dataset.id); save(); rerender(); toast('Question deleted.'); },
  'admin-del-r': a => { removeContent('response', a.dataset.id); save(); rerender(); toast('Response deleted.'); },
  seen: a => { S.responses.find(x => x.id === a.dataset.id).seen = true; save(); rerender(); },
  'seen-all': () => { S.responses.forEach(r => r.seen = true); save(); rerender(); },
  'rep-delete': a => { const rep = S.reports.find(r => r.id === a.dataset.id); removeContent(rep.kind, rep.targetId, rep.parentId); save(); rerender(); toast('Post deleted.'); },
  'rep-suspend': a => { const rep = S.reports.find(r => r.id === a.dataset.id); const c = findContent(rep); removeContent(rep.kind, rep.targetId, rep.parentId); if (c) member(c.memberId).status = 'suspended'; save(); rerender(); toast('Post deleted and ' + esc(member(c.memberId).display) + ' suspended.'); },
  'rep-keep': a => { S.reports = S.reports.filter(r => r.id !== a.dataset.id); save(); rerender(); toast('Report dismissed. The post stays up.'); },
  'lf-addprompt': () => { syncLessonForm(); UI.lessonForm.prompts.push(''); rerender(); const i = UI.lessonForm.prompts.length - 1; const el = $('#f-p' + i); if (el) el.focus(); },
  'lf-rmprompt': a => { syncLessonForm(); UI.lessonForm.prompts.splice(+a.dataset.i, 1); rerender(); },
  'lf-sample': () => { Object.assign(UI.lessonForm, { title: 'Phrasal Verbs with LOOK', doc: DOC(99), yt: YT(99), prompts: ['What is something you are looking forward to this month?', 'Who do you look up to, and why?'], intro: 'Choose one of the questions below and answer by text or audio.' }); UI.formErr = {}; rerender(); },
  'view-published': () => { const id = UI.published; UI.published = null; S.role = 'member'; save(); go('lesson-' + id); },
  'add-another': () => { UI.published = null; UI.lessonForm = null; go('admin-add'); },
  'make-lotw': a => { S.lotw = +a.dataset.id; save(); rerender(); toast('Lesson of the Week updated.'); },
  'lesson-del': a => { UI.confirming = 'lesson:' + a.dataset.id; rerender(); },
  'lesson-del-yes': a => { const id = +a.dataset.id; S.lessons = S.lessons.filter(l => l.id !== id); S.responses = S.responses.filter(r => r.lessonId !== id); if (S.lotw === id) S.lotw = lessonsSorted()[0].id; clearInline(); save(); rerender(); toast('Lesson deleted.'); },
  'promo-noimg': () => { UI.promoDraft.image = null; rerender(); },
  'promo-new': () => { UI.promoDraft = { on: S.promo.on, tag: '', headline: '', text: '', image: null, btnText: '', btnLink: '' }; rerender(); $('#pr-h').focus(); },
  'member-suspend': a => { const m = member(a.dataset.id); m.status = m.status === 'suspended' ? 'active' : 'suspended'; save(); rerender(); toast(esc(m.display) + (m.status === 'suspended' ? ' is suspended. They can read but not post.' : ' can post again.')); },
  'member-remove': a => { UI.confirming = 'member:' + a.dataset.id; rerender(); },
  'member-remove-yes': a => { const id = a.dataset.id; const m = member(id); S.responses = S.responses.filter(r => r.memberId !== id); S.intros = S.intros.filter(i => i.memberId !== id); S.intros.forEach(i => i.replies = i.replies.filter(r => r.memberId !== id)); S.qa = S.qa.filter(q => q.memberId !== id); S.members = S.members.filter(x => x.id !== id); S.reports = S.reports.filter(r => findContent(r)); clearInline(); save(); rerender(); toast(esc(m.display) + ' was removed.'); }
};
function scrollToPost(id) { const el = document.getElementById('p-' + id); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' }); }
function finishSetup() {
  S.firstVisit = true;
  if (S.pendingQuery) { UI.search = S.pendingQuery; S.pendingQuery = ''; }
  save(); go('home');
}
function syncLessonForm() {
  document.querySelectorAll('[data-prompt]').forEach(t => UI.lessonForm.prompts[+t.dataset.prompt] = t.value);
}

/* ---------- forms ---------- */
const FORMS = {
  join: f => {
    const name = $('#jname').value.trim(), email = $('#jemail').value.trim();
    UI.formErr = {};
    if (!name) UI.formErr.name = 'Please add your name.';
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) UI.formErr.email = 'That email doesn\'t look complete. Check for a missing @ or dot.';
    S.signup = { name, email };
    if (Object.keys(UI.formErr).length) { rerender(); return; }
    const me = member('me'); me.name = name; me.email = email; me.display = name.split(' ')[0]; me.photo = null;
    save(); go('verify');
  },
  login: () => go('loginsent'),
  setup: () => { const d = $('#sdisp').value.trim(); if (d) member('me').display = d; finishSetup(); },
  search: () => { const i = $('#homeq'); i.blur(); const r = $('#homeres'); if (r && r.firstElementChild) r.scrollIntoView({ behavior: 'smooth', block: 'start' }); },
  intro: () => {
    const t = $('#introtext').value.trim(); if (!t) { toast('Write your introduction first.'); return; }
    const id = uid('i'); S.intros.push({ id, memberId: meId(), date: nowIso(), text: t, replies: [] }); save(); render(); scrollToPost(id);
  },
  ask: () => {
    const q = $('#askq').value.trim(), d = $('#askd').value.trim();
    if (!q) { toast('Type your question first.'); $('#askq').focus(); return; }
    const id = uid('q'); S.qa.push({ id, memberId: meId(), date: nowIso(), q, detail: d, answer: null }); UI.qaSearch = ''; save(); render(); scrollToPost(id);
    toast('Question posted. You\'ll get an email when Anming answers.');
  },
  profile: () => { const d = $('#pdisp').value.trim(); if (!d) { toast('Your display name can\'t be empty.'); return; } member(meId()).display = d; save(); rerender(); toast('Saved. Other members now see "' + esc(d) + '".'); },
  lesson: () => {
    syncLessonForm();
    const f = UI.lessonForm; UI.formErr = {};
    if (!f.title.trim()) UI.formErr.title = 'Add the lesson title.';
    if (!f.doc.trim()) UI.formErr.doc = 'Paste the Google Doc link.';
    else if (!/^https?:\/\/docs\.google\.com\//.test(f.doc.trim())) UI.formErr.doc = 'This doesn\'t look like a Google Docs link. It should start with https://docs.google.com/';
    const prompts = f.prompts.map(p => p.trim()).filter(Boolean);
    if (!prompts.length) UI.formErr.prompts = 'Add at least one prompt for the assignment.';
    if (Object.keys(UI.formErr).length) { rerender(); return; }
    let l;
    if (f.id) { l = lesson(f.id); }
    else { l = { id: Math.max(0, ...S.lessons.map(x => x.id)) + 1 }; S.lessons.push(l); }
    Object.assign(l, { title: f.title.trim(), doc: f.doc.trim(), yt: f.yt.trim(), ytTitle: f.ytTitle || f.title.trim(), keywords: f.keywords, date: f.date || TODAY, assignment: { intro: f.intro.trim(), prompts } });
    if (f.lotw) S.lotw = l.id; else if (S.lotw === l.id) S.lotw = lessonsSorted().find(x => x.id !== l.id).id;
    save();
    if (f.id) { UI.lessonForm = null; go('admin-lessons'); toast('Saved. Changes are live.'); }
    else { UI.published = l.id; UI.lessonForm = null; go('admin-add'); }
  },
  promo: () => { S.promo = Object.assign({}, UI.promoDraft, { on: S.promo.on }); UI.promoDraft = Object.assign({}, S.promo); save(); rerender(); toast('Published. Members see the new promotion on their next visit.'); }
};

/* ---------- live inputs ---------- */
const LIVE = {
  pub: v => { UI.search = v; S.pendingQuery = v.trim(); save(); $('#pubres').innerHTML = pubResults(v, v.trim() ? searchLessons(v).slice(0, 3) : []); },
  home: v => { UI.search = v; S.firstVisit = false; $('#homeres').innerHTML = homeResults(v); },
  lib: v => { UI.libSearch = v; UI.libShow = 15; $('#libres').innerHTML = libList(v); },
  qa: v => { UI.qaSearch = v; const y = window.scrollY; const keep = document.activeElement; $('#app').querySelector('#qalist').innerHTML = (() => { let list = S.qa.slice().sort((a, b) => b.date.localeCompare(a.date)); if (v.trim()) { const fake = list.map(x => ({ id: x.id, date: x.date, title: x.q, ytTitle: x.detail, keywords: x.answer ? x.answer.text : '' })); list = searchLessons(v, fake).map(x => S.qa.find(q => q.id === x.id)); } return qaList(list); })(); },
  atext: v => { UI.assign.text = v; },
  alq: v => { UI.adminLessonSearch = v; $('#allist').innerHTML = adminLessonRows(v.trim() ? searchLessons(v) : lessonsSorted()); },
  mq: v => { UI.memberSearch = v; const pos = $('#mq').selectionStart; rerender(); const i = $('#mq'); i.focus(); i.setSelectionRange(pos, pos); }
};

document.addEventListener('click', e => {
  const roleBtn = e.target.closest('.roles button');
  if (roleBtn) { setRole(roleBtn.dataset.role); return; }
  const tr = e.target.closest('[data-try]');
  if (tr) { const i = $('#homeq'); i.value = tr.dataset.try; LIVE.home(i.value); return; }
  const g = e.target.closest('[data-go]');
  if (g) { e.preventDefault(); if (g.dataset.go === 'home' && UI.route === 'home') UI.search = UI.search; clearInline(); go(g.dataset.go); return; }
  const a = e.target.closest('[data-act]');
  if (a && a.tagName !== 'INPUT' && ACT[a.dataset.act]) { e.preventDefault(); ACT[a.dataset.act](a, e); return; }
  if ((UI.menu && !e.target.closest('.menu')) || ((UI.navOpen || UI.ddOpen) && !e.target.closest('#sitenav'))) { UI.menu = UI.navOpen = UI.ddOpen = false; rerender(); }
});
document.addEventListener('submit', e => { const f = e.target.closest('[data-form]'); if (!f) return; e.preventDefault(); FORMS[f.dataset.form](f); });
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.live && LIVE[t.dataset.live]) LIVE[t.dataset.live](t.value);
  if (t.dataset.lf && t.type !== 'checkbox') { UI.lessonForm[t.dataset.lf] = t.value; markStep(t); }
  if (t.dataset.prompt) { UI.lessonForm.prompts[+t.dataset.prompt] = t.value; markStep(t); }
  if (t.dataset.pf) {
    UI.promoDraft[t.dataset.pf] = t.value;
    if (t.dataset.pf === 'text') $('#pr-count').textContent = t.value.length;
    $('#promoprev').innerHTML = '<div class="mini">Find your lesson <span>Video title or topic</span></div>' + promoBlock(UI.promoDraft, true);
    const b = document.querySelector('[data-form="promo"] [type="submit"]'); const dirty = JSON.stringify(UI.promoDraft) !== JSON.stringify(S.promo);
    b.disabled = !dirty; b.textContent = dirty ? 'Publish changes' : 'Published';
  }
});
function markStep(t) {
  const st = t.closest('.fstep'); if (!st) return;
  const f = UI.lessonForm, k = t.dataset.lf || 'prompt';
  const done = k === 'title' ? !!f.title.trim() : k === 'doc' ? /docs\.google\.com/.test(f.doc) : k === 'yt' ? /youtu/.test(f.yt) : (k === 'prompt' || k === 'intro') ? f.prompts.some(p => p.trim()) : st.classList.contains('done');
  st.classList.toggle('done', done); st.querySelector('.n').textContent = done ? '✓' : [...st.parentNode.children].indexOf(st) + 1;
}
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.act === 'pick-prompt') UI.assign.prompt = +t.value;
  if (t.dataset.act === 'pref') { S.prefs[t.dataset.k] = t.checked; save(); toast(t.dataset.k === 'roundup' ? (t.checked ? 'You\'re subscribed to the monthly roundup.' : 'Unsubscribed from the monthly roundup.') : (t.checked ? 'You\'ll get an email when Anming replies to you.' : 'No emails when Anming replies. You\'ll still see replies here.')); }
  if (t.dataset.act === 'promo-toggle') { S.promo.on = t.checked; if (UI.promoDraft) UI.promoDraft.on = t.checked; save(); rerender(); toast(t.checked ? 'The featured block is showing again.' : 'The featured block is turned off.'); }
  if (t.dataset.lf === 'lotw') UI.lessonForm.lotw = t.checked;
  if (t.id === 'photoin' && t.files[0]) resizeImage(t.files[0], 240, url => { member(meId()).photo = url; save(); rerender(); });
  if (t.id === 'pr-img' && t.files[0]) resizeImage(t.files[0], 900, url => { UI.promoDraft.image = url; rerender(); });
});
window.addEventListener('popstate', () => { UI.route = location.hash.slice(1); render(); });

/* demo bar */
$('#notesbtn').addEventListener('click', () => { const c = document.body.classList.toggle('clean'); $('#notesbtn').textContent = c ? 'Show notes' : 'Hide notes'; });
$('#resetbtn').addEventListener('click', () => { try { localStorage.removeItem(KEY); } catch (e) {} S = seedState(); Object.assign(UI, { search: '', libSearch: '', qaSearch: '', lessonForm: null, promoDraft: null, published: null }); clearInline(); recReset(); save(); go('home'); toast('Demo reset to the starting sample data.'); });

function afterRender() {
  document.documentElement.style.setProperty('--demoh', $('.demobar').offsetHeight + 'px');
}
const _go = go;
go = function (route, keep) { if (route !== UI.route) { UI.prev = UI.route; if (R.state !== 'idle') recReset(); } _go(route, keep); };

UI.route = (location.hash || '').slice(1);
render();
window.addEventListener('resize', afterRender);

</script>
</body>
</html>
